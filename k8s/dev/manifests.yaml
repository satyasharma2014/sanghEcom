apiVersion: v1
kind: Namespace
metadata:
  name: sanghecom
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sanghecom-sa
  namespace: sanghecom
  annotations:
    azure.workload.identity/client-id: "c7f763b2-a35e-4685-94cb-33100a55465c"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sanghecom-kv
  namespace: sanghecom
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "c7f763b2-a35e-4685-94cb-33100a55465c"
    keyvaultName: "kv-sg-dev-ss01"
    tenantId: "8fd98561-5fee-46e2-af7a-1c5a19ceb5f1"
    objects: |
      array:
        - |
          objectName: catalog-db-connection
          objectType: secret
        - |
          objectName: inventory-db-connection
          objectType: secret
        - |
          objectName: payment-db-connection
          objectType: secret
        - |
          objectName: notification-db-connection
          objectType: secret
        - |
          objectName: orders-db-connection
          objectType: secret
        - |
          objectName: rabbitmq-username
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
  secretObjects:
    - secretName: catalog-db
      type: Opaque
      data:
        - objectName: catalog-db-connection
          key: connection-string
    - secretName: inventory-db
      type: Opaque
      data:
        - objectName: inventory-db-connection
          key: connection-string
    - secretName: payment-db
      type: Opaque
      data:
        - objectName: payment-db-connection
          key: connection-string
    - secretName: notification-db
      type: Opaque
      data:
        - objectName: notification-db-connection
          key: connection-string
    - secretName: orders-db
      type: Opaque
      data:
        - objectName: orders-db-connection
          key: connection-string
    - secretName: rabbitmq-credentials
      type: Opaque
      data:
        - objectName: rabbitmq-username
          key: username
        - objectName: rabbitmq-password
          key: password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sanghecom-config
  namespace: sanghecom
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Port: "5672"
  RabbitMq__Exchange: "sanghecom.events"
  Services__Catalog: "http://catalog-api:8080"
  Services__Inventory: "http://inventory-api:8080"
  Services__Payment: "http://payment-api:8080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: sanghecom
  labels:
    app: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sanghecom-sa
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          readinessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sanghecom-kv
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: sanghecom
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: sanghecom
  labels:
    app: catalog-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: catalog-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: sanghecom-sa
      containers:
        - name: catalog-api
          image: sanghecomacr.azurecr.io/catalog-api:IMAGE_TAG
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: sanghecom-config
          env:
            - name: ConnectionStrings__CatalogDb
              valueFrom:
                secretKeyRef:
                  name: catalog-db
                  key: connection-string
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      serviceAccountName: sanghecom-sa
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: sanghecom-kv
